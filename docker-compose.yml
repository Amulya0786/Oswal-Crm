services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oswal
      POSTGRES_PASSWORD: oswal
      POSTGRES_DB: oswal
    ports:
      - "5432:5432"
    volumes:
      - oswal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oswal -d oswal"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  oswal_pg:
