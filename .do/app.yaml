# DigitalOcean App Platform. Bangalore (blr). Data stays in India.
# Photos go to a private Space in blr1. WhatsApp, SMS, speech, AI and push are left unset.
name: oswal-service
region: blr

services:
  - name: web
    github:
      repo: Amulya0786/Oswal-Crm
      branch: cursor/oswal-service-crm-5f17
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 9

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Amulya0786/Oswal-Crm
      branch: cursor/oswal-service-crm-5f17
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: npx prisma migrate deploy && node scripts/bootstrap.mjs
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1

databases:
  - name: oswal-db
    engine: PG
    version: "16"
    production: true
    cluster_name: oswal-pg
    db_name: oswal
    db_user: oswal

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${oswal-db.DATABASE_URL}
  - key: IMPORT_CUTOFF
    scope: RUN_TIME
    value: "2026-04-01"
  - key: NEXT_PUBLIC_DEMO_HINTS
    scope: RUN_AND_BUILD_TIME
    value: "0"
  - key: ENABLE_JOBS
    scope: RUN_TIME
    value: "1"
  - key: S3_ENDPOINT
    scope: RUN_TIME
    value: https://blr1.digitaloceanspaces.com
  - key: S3_REGION
    scope: RUN_TIME
    value: blr1
  - key: S3_BUCKET
    scope: RUN_TIME
    value: oswal-service-files
  - key: S3_ACCESS_KEY
    scope: RUN_TIME
    type: SECRET
    value: enter-spaces-key
  - key: S3_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
    value: enter-spaces-secret
  - key: AUTH_SECRET
    scope: RUN_TIME
    type: SECRET
    value: enter-a-long-random-auth-secret
  - key: CRON_SECRET
    scope: RUN_TIME
    type: SECRET
    value: enter-a-long-random-cron-secret
  - key: OSWAL_API_KEY
    scope: RUN_TIME
    type: SECRET
    value: enter-a-long-random-api-key
  - key: ADMIN_EMAIL
    scope: RUN_TIME
    type: SECRET
    value: set-admin-email
  - key: ADMIN_INITIAL_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: change
